name: Nhac truoc gio cup dien

on:
  schedule:
    # Chay dung 1 lan moi ngay luc 6h00 sang gio Viet Nam (23:00 UTC hom truoc,
    # vi VN = UTC+7). Gui thong bao cho tat ca lich cup dien trong vong 36h
    # toi tinh tu thoi diem nay (xem ly do chon 36h thay vi 24h trong
    # scripts/nhac-truoc-gio-cup-dien.mjs) — khong gui ngay khi vua phat hien
    # du lieu moi trong ngay, du co cap nhat lich moi cung phai doi den 6h
    # sang hom sau.
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  nhac:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cai dat dependencies
        run: npm install

      - name: Gui nhac cho ban ghi sap den gio cup
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_JSON }}
        run: node scripts/nhac-truoc-gio-cup-dien.mjs
