name: Cap nhat lich cup dien va gui thong bao

on:
  schedule:
    # Chay moi 6 tieng (gio UTC). 23:00,05:00,11:00,17:00 UTC = 06:00,12:00,18:00,00:00 gio VN
    - cron: "0 23,5,11,17 * * *"
  workflow_dispatch: {} # cho phep bam chay tay tu tab Actions de test
# Thêm cấu hình quyền trực tiếp tại đây
permissions:
  contents: write
  pull-requests: write

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cai dat dependencies
        run: npm install

      - name: Lay du lieu lich cup dien tu EVNSPC
        run: node scripts/lay-du-lieu.mjs

      - name: Dong bo Firestore va gui thong bao
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_JSON }}
        run: node scripts/dong-bo-va-gui-thong-bao.mjs
