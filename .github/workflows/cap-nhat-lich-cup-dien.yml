name: Dong bo lich cup dien (khong gui thong bao)

on:
  schedule:
    # 23:00 UTC = 06:00 gio VN (sang) | 11:00 UTC = 18:00 gio VN (toi)
    # Chi 2 lan/ngay theo dung nhu cau: du de phat hien lich moi va gui nhac
    # "mai cup dien" dung 1 lan truoc gio cup, khong can quet day dac hon.
    - cron: "0 23,11 * * *"
  workflow_dispatch: {} # cho phep bam chay tay tu tab Actions de test

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    permissions:
      contents: write # can de commit lai data/danh-muc-khu-pho.json khi phat hien Xa/Phuong hoac khu pho moi
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cai dat dependencies
        run: npm install

      - name: Lay du lieu lich cup dien tu EVNSPC (co the tu phat hien Xa/Phuong hoac khu pho moi)
        run: node scripts/lay-du-lieu.mjs

      - name: Dong bo Firestore va gui thong bao
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_JSON }}
        run: node scripts/dong-bo-va-gui-thong-bao.mjs

      - name: Tu dong commit neu danh muc khu pho co thay doi
        run: |
          if ! git diff --quiet -- data/danh-muc-khu-pho.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Cau hinh merge driver rieng cho file danh muc khu pho: du lieu
            # chi-them-vao-cuoi nen xung dot van ban thong thuong la khong can
            # thiet - chi can hop nhat (union) 2 phia. Xem scripts/hop-nhat-danh-muc.mjs
            git config merge.danh-muc-hop-nhat.driver "node scripts/hop-nhat-danh-muc.mjs %A %O %B"
            git add -- data/danh-muc-khu-pho.json
            git commit -m "Tu dong cap nhat danh muc khu pho (phat hien Xa/Phuong hoac khu pho/ap moi)"
            # --autostash: tu cat tam moi thay doi CHUA COMMIT khac (vd file trung
            # gian nao do lo bi track) truoc khi rebase, roi khoi phuc lai sau -
            # tranh loi "cannot pull with rebase: You have unstaged changes."
            git pull --rebase --autostash origin main
            git push
          else
            echo "Danh muc khu pho khong doi, khong can commit."
          fi
